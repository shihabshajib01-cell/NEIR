    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem('neir.theme');
          const theme = storedTheme === 'dark' ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();

      (() => {
        const currentBuild = 'd4792148bb19199b6147794054de04f940a263ff';
        const basePath = window.location.pathname.endsWith('/')
          ? window.location.pathname
          : window.location.pathname.replace(/\/[^/]*$/, '/');

        fetch(basePath + 'version.json?ts=' + Date.now(), { cache: 'no-store' })
          .then((response) => response.ok ? response.json() : null)
          .then((version) => {
            const latestBuild = version?.build;
            if (!latestBuild || latestBuild === currentBuild) return;

            const url = new URL(window.location.href);
            if (url.searchParams.get('__build') === latestBuild) return;

            url.searchParams.set('__build', latestBuild);
            window.location.replace(url.pathname + url.search + url.hash);
          })
          .catch(() => {});
      })();
    </script>
