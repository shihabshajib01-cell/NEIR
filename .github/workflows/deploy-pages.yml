name: Build NEIR static site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: neir-static-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize Office Management theme
        run: node scripts/normalize-office-theme.mjs

      - name: Restore Vite source index
        run: cp index.source.html index.html

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production site
        run: npm run build

      - name: Publish compiled output to Pages branch source
        run: |
          rm -rf assets
          cp -R dist/assets ./assets
          cp dist/index.html ./index.html
          cp dist/logo.png ./logo.png
          touch .nojekyll

      - name: Commit compiled site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src index.source.html index.html assets logo.png .nojekyll
          if git diff --cached --quiet; then
            echo "Compiled site is already current."
          else
            git commit -m "style: publish Office Management themed NEIR site [skip ci]"
            git push origin HEAD:main
          fi
